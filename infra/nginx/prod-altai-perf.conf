# Сжатие текстовых ответов (perf-оптимизация 11.08.2026). gzip on уже в
# nginx.conf, но gzip_proxied/gzip_types там закомментированы — витрина идёт
# через proxy_pass, поэтому её ассеты (js/css 346+177+122 КБ) уходили
# НЕСЖАТЫМИ. brotli в сборку nginx не включён — используем gzip (7 л 70-75%).
# woff2/jpg/png уже сжаты внутри — их не трогаем (пустая трата CPU).
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf;

# Согласование формата картинки по заголовку Accept (try_files в /img/ и
# /uploads/): сначала пробуем .avif, затем .webp, иначе исходный .jpg/.png.
# Ноль изменений кода витрины, автоматический fallback на старых браузерах.
#
# ЛОВУШКА: если для неподдержанного формата подставлять "", то первым
# кандидатом try_files становится САМ $uri — и .jpg отдаётся раньше, чем
# дело дойдёт до .webp (так и случилось при первой правке). Поэтому вместо
# пустой строки подставляем заведомо несуществующее расширение: кандидат
# гарантированно промахивается, и очередь честно доходит до следующего.
map $http_accept $avif_suffix {
    default        ".__no";
    "~*image/avif" ".avif";
}
map $http_accept $webp_suffix {
    default        ".__no";
    "~*image/webp" ".webp";
}

# --- Микрокеш SSR-страниц витрины (perf 11.08.2026) ---
# Витрина отдаётся сервер-рендерингом (TanStack Start, :3003): каждый заход
# = React-рендер + запросы к бэкенду, ~250 мс TTFB на прогретом сервере и до
# 2 с на холодном. HTML витрины ОДИНАКОВ для всех: cookie не ставятся,
# корзина живёт в localStorage на клиенте, — поэтому его можно держать в
# общем кеше несколько секунд.
#
# 30 с выбраны под кеш каталога в бэкенде (TTL 60 с): правка в админке
# доезжает до посетителя максимум за полминуты сверх обычного.
# use_temp_path=off — писать сразу в кеш-каталог, без лишнего копирования.
proxy_cache_path /var/cache/nginx/altai_ssr levels=1:2 keys_zone=altai_ssr:16m
                 max_size=512m inactive=10m use_temp_path=off;

# Страницы, которые НИКОГДА не кладём в общий кеш: корзина, оформление и
# страница конкретного заказа (личные данные покупателя и статус оплаты).
# Ответ на любой другой GET витрины безличен.
map $request_uri $altai_ssr_nocache {
    default          0;
    "~^/cart"        1;
    "~^/checkout"    1;
    "~^/order/"      1;
}
