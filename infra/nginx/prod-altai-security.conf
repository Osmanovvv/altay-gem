# Заголовки безопасности (добавлено 11.08.2026, аудит перед сдачей).
# nosniff — запрет MIME-подмены; SAMEORIGIN — антикликджекинг (сайт нельзя
# встроить в чужой iframe); Referrer-Policy — не течёт полный URL на чужие
# домены; HSTS — год форсированного HTTPS. CSP намеренно НЕ ставим: строгая
# политика сломала бы SSR-витрину (виджеты отзывов 2ГИС/Яндекс, шрифты) —
# заводится отдельно с прогоном. add_header наследуется в location, т.к. в
# самих location'ах своих add_header нет. always — чтобы заголовки были и на
# 4xx/5xx.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ⚠️ ПОПРАВКА 29.08.2026. Утверждение выше про наследование ОКАЗАЛОСЬ НЕВЕРНЫМ.
# У витрины (location / боевого домена) есть свой `add_header X-Cache-Status`
# от микрокеша, добавленный в тот же день, — и он молча погасил весь этот
# сниппет для HTML-страниц. Заголовки были на картинках и статике (там сниппет
# подключён повторно), но НЕ на страницах сайта и мини-аппа. Исправлено
# отдельным файлом prod-altai-security-html.conf, подключённым внутрь того
# самого location. Правило nginx: блок со СВОИМ add_header теряет ВСЕ
# унаследованные — проверять отданные заголовки, а не только конфиг.
