# Заголовки безопасности для HTML-страниц витрины (29.08.2026).
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ. В nginx блок, объявивший СВОЙ add_header, теряет ВСЕ
# унаследованные. У витрины есть свой `add_header X-Cache-Status` от микрокеша
# — и он с 11.08 молча глушил snippets/altai-security.conf с уровня server.
# В итоге страницы сайта и мини-аппа не отдавали ни одного заголовка
# безопасности, хотя у картинок и статики они были (там сниппет подключён
# повторно). Поэтому здесь заголовки перечислены явно.
#
# ВМЕСТО X-Frame-Options — Content-Security-Policy: frame-ancestors.
# X-Frame-Options умеет только «свой домен или никто», а мини-приложение MAX
# обязано открываться внутри мессенджера. frame-ancestors позволяет назвать
# исключение: свой домен плюс max.ru, всем остальным встраивание запрещено.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "frame-ancestors 'self' https://*.max.ru" always;
