server {
    listen 80;
    listen [::]:80;
    server_name altai.201-51-29-69.sslip.io altai-admin.201-51-29-69.sslip.io ecomarket-altai.ru www.ecomarket-altai.ru admin.ecomarket-altai.ru;
    location /.well-known/acme-challenge/ { root /var/www/altai-certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name altai.201-51-29-69.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/altai.201-51-29-69.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altai.201-51-29-69.sslip.io/privkey.pem;
    client_max_body_size 25m;
    include snippets/altai-security.conf;

    location = /api/v1/admin/login {
        limit_req zone=altai_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=altai_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        root /opt/altai/apps/strapi/public;
        try_files $uri$avif_suffix $uri$webp_suffix $uri =404;
        include snippets/altai-security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Vary "Accept" always;
    }
    location /img/ {
        root /opt/altai/apps/frontend/.output/public;
        try_files $uri$avif_suffix $uri$webp_suffix $uri =404;
        include snippets/altai-security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Vary "Accept" always;
    }
    # Собранные js/css/шрифты витрины. Раньше они шли через Node (location /):
    # каждый файл — лишний прокси-хоп и место в кеше SSR. Отдаём с диска.
    # Имена содержат хеш содержимого, поэтому immutable на год безопасен:
    # новая сборка = новые имена.
    location /assets/ {
        root /opt/altai/apps/frontend/.output/public;
        try_files $uri =404;
        include snippets/altai-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name altai-admin.201-51-29-69.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/altai.201-51-29-69.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altai.201-51-29-69.sslip.io/privkey.pem;
    client_max_body_size 50m;
    include snippets/altai-security.conf;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- ecomarket-altai.ru (боевой домен) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ecomarket-altai.ru;
    ssl_certificate     /etc/letsencrypt/live/ecomarket-altai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecomarket-altai.ru/privkey.pem;
    return 301 https://ecomarket-altai.ru$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ecomarket-altai.ru;
    ssl_certificate     /etc/letsencrypt/live/ecomarket-altai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecomarket-altai.ru/privkey.pem;
    client_max_body_size 25m;
    include snippets/altai-security.conf;

    location = /api/v1/admin/login {
        limit_req zone=altai_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=altai_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        root /opt/altai/apps/strapi/public;
        try_files $uri$avif_suffix $uri$webp_suffix $uri =404;
        include snippets/altai-security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Vary "Accept" always;
    }
    location /img/ {
        root /opt/altai/apps/frontend/.output/public;
        try_files $uri$avif_suffix $uri$webp_suffix $uri =404;
        include snippets/altai-security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Vary "Accept" always;
    }
    # Собранные js/css/шрифты витрины. Раньше они шли через Node (location /):
    # каждый файл — лишний прокси-хоп и место в кеше SSR. Отдаём с диска.
    # Имена содержат хеш содержимого, поэтому immutable на год безопасен:
    # новая сборка = новые имена.
    location /assets/ {
        root /opt/altai/apps/frontend/.output/public;
        try_files $uri =404;
        include snippets/altai-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Микрокеш SSR (см. conf.d/altai-perf.conf): один рендер обслуживает
        # всех посетителей ближайшие 30 с. Корзина/оформление/заказ в кеш не
        # попадают ($altai_ssr_nocache). Ключ включает request_uri, поэтому
        # фильтры каталога кешируются раздельно.
        proxy_cache altai_ssr;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_bypass $altai_ssr_nocache;
        proxy_no_cache $altai_ssr_nocache;
        # Один запрос идёт на бэкенд, остальные ждут его ответ, а не бомбят
        # SSR параллельно; протухшую копию отдаём, пока обновляем в фоне.
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

